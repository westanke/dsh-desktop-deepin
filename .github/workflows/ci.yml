name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Test and scan
    # 只跑 ubuntu：本项目只发 Linux deb（Deepin / UOS），Windows 与 macOS 既不做
    # 安装包、也不发布任何产物。此前矩阵里的 windows-latest 固定失败 5 项 ——
    # 断言写的是 POSIX 路径字面量（/home/u/.dsh），而 Windows 的 path.join 产出
    # 反斜杠（\home\u\.dsh）；macos-latest 虽同为 POSIX 而恰好通过，但同样是在测
    # 一个不发行的平台，只消耗 CI 时间。
    #
    # 与其为一个不存在的使用场景维护跨平台断言，不如与下方 e2e job 保持一致：
    # 只在产物真正服务的平台上测试。将来若真要支持某平台，届时连断言一起补。
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # scan-leaks inspects the committed history, not just the working tree.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.15'

      - name: Install shell dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Scan for content that must not be published
        run: npm run scan:leaks

      # 文档口径门禁：README 的 bundled 内核版本必须与 upstream.lock.json 的 kernel.version
      # 一致，CHANGELOG 必须有 Unreleased 或与 package.json version 匹配的条目。
      # 放在这里而不是 prepack:app：文档漂移在**合入那一刻**就该红，不必等到本地打包；
      # 且纯读零依赖，耗时毫秒级，不影响本地 dist:linux 的节奏。
      - name: Check documentation consistency
        run: npm run docs:check

  e2e:
    name: End-to-end (ubuntu)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.15'

      - name: Install shell dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      # Verifies the pinned version and integrity as part of installing, so a registry
      # serving something other than what upstream.lock.json names fails here. This
      # project ships Linux debs only, so the kernel e2e runs on the platform the
      # artifacts are actually built for — the matrix previously ran win/mac, which
      # tested platforms this shell does not target while the one it does had no
      # end-to-end coverage at all.
      - name: Install the pinned kernel
        run: npm run kernel:install

      - name: Start the kernel for real and assert it serves
        run: npm run test:e2e
